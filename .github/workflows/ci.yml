name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
      # xvfb: the Swing widgets are tested on a virtual display.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Build and test
        run: xvfb-run -a mvn -B verify
