name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
      # xvfb: the Swing widgets are tested on a virtual display.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Build and test
        run: xvfb-run -a mvn -B verify

  # Installs the built plugin into a real Fiji Latest and checks it loads headless.
  fiji-smoke:
    runs-on: ubuntu-latest
    env:
      FIJI_URL: https://downloads.imagej.net/fiji/latest/fiji-latest-linux64-jdk.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
      # Key the cache on the zip's Last-Modified so a new Fiji build is picked up.
      - name: Fiji Latest version stamp
        id: stamp
        run: |
          lm=$(curl -sIL "$FIJI_URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified"{v=$2} END{print v}')
          echo "Last-Modified: ${lm:-unknown}"
          echo "key=$(echo "${lm:-$(date +%G-%V)}" | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Fiji
        id: cache
        uses: actions/cache@v4
        with:
          path: fiji-download
          key: fiji-latest-linux64-jdk-${{ steps.stamp.outputs.key }}
      - name: Download Fiji
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fiji-download
          curl -fsSL -o fiji-download/fiji.zip "$FIJI_URL"
      - name: Unpack Fiji
        run: unzip -q fiji-download/fiji.zip -d fiji-unpacked && mv fiji-unpacked/Fiji* ./Fiji.app
      # Copies the plugin jar and the dependencies Fiji lacks into the install.
      - name: Install plugin into Fiji
        run: mvn -B install -DskipTests -Dscijava.app.directory=./Fiji.app -Ddelete.other.versions=true
      - name: Smoke test
        run: ./Fiji.app/fiji-linux-x64 --headless --run .github/scripts/smoke.groovy
